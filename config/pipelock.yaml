version: 1
mode: strict
enforce: true

api_allowlist:
  - api.anthropic.com
  - claude.ai
  - code.claude.com
  - platform.claude.com
  - api.openai.com
  - auth.openai.com
  - chatgpt.com
  - github.com
  - "*.github.com"
  - "*.githubusercontent.com"
  - pypi.org
  - files.pythonhosted.org
  - registry.npmjs.org

forward_proxy:
  enabled: true
  # CONNECT target must match the TLS ClientHello SNI (blocks domain fronting).
  sni_verification: true
  # Bytes inside a CONNECT tunnel must be TLS (blocks raw protocol smuggling).
  sni_require_tls: true

tls_interception:
  enabled: false
