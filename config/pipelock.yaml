# GENERATED FILE — do not edit.
#
# Rendered from config.toml by ./run.py, via templates/pipelock.yaml.j2.
# To change the allowlist, edit config.toml and run `./run.py policy`
# (or just `./run.py up`, which regenerates first). A hand edit here is
# silently overwritten and is caught by the test suite.
#
# Pipelock configuration: strict standard forward proxy, default deny.
# This is the Pipelock rendering of the shared logical policy in
# docs/policy.md.
#
# MCP / A2A / fetch-API features of Pipelock are intentionally unused.
# TLS interception stays disabled for v1 (docs/architecture.md, "Non-goals").

version: 1
mode: strict
enforce: true

api_allowlist:
  - github.com
  - "*.github.com"
  - "*.githubusercontent.com"
  - pypi.org
  - files.pythonhosted.org
  - registry.npmjs.org

forward_proxy:
  enabled: true
  # CONNECT target must match the TLS ClientHello SNI (blocks domain fronting).
  sni_verification: true
  # Bytes inside a CONNECT tunnel must be TLS (blocks raw protocol smuggling).
  sni_require_tls: true

tls_interception:
  enabled: false
