#
# Rendered from config.toml by ./run.py, via templates/pipelock.yaml.j2.
# To change the allowlist, edit config.toml and run `./run.py policy`
# (or just `./run.py up`, which regenerates first). A hand edit here is
# silently overwritten and is caught by the test suite.
#
# TEST POLICY — NEVER use for normal operation. config/pipelock.yaml plus
# the `[policy.test]` fixtures. See docs/policy.md, "Test policy".
