#
# Rendered from config.toml by ./run.py, via templates/squid.conf.j2.
# To change the allowlist, edit config.toml and run `./run.py policy`
# (or just `./run.py up`, which regenerates first). A hand edit here is
# silently overwritten and is caught by the test suite.
#
# Squid egress policy: default deny, hostname allowlist, IP-layer SSRF
# floors evaluated after DNS resolution.
#
# This file is the Squid expression of the shared logical policy in
# docs/policy.md. The allowlist below comes from config.toml and is
# rendered identically into every engine's config, so the three cannot
# drift apart.
#
# Order matters: `http_access` is first-match-wins, so every deny floor is
# stated before the allowlist. An allowlisted hostname that resolves to a
# private address is therefore denied by the IP rules rather than allowed
# by the name rule — which is the whole point of validating after DNS
# resolution (docs/policy.md).
#
# Squid refuses to start on a `dstdomain` list containing both `d` and `.d`
# ("'.d' is a subdomain of 'd'"), so the shared policy's two forms map onto
# two separate ACLs:
#
#     d    ->  acl allowlist_exact dstdomain d
#     *.d  ->  acl allowlist_wild  dstdom_regex -i \.d$
#
# The anchored regex matches subdomains only, never the apex, which is
# exactly what `*.d` means in docs/policy.md. Writing `.d` in `dstdomain`
# form would silently widen the policy by also covering the apex.

# ---------------------------------------------------------------------------
# Listener
# ---------------------------------------------------------------------------

# A plain forward-proxy port: no `ssl-bump`, so CONNECT tunnels are relayed
# without Squid looking inside them. Squid *can* peek at the TLS
# ClientHello without decrypting (`ssl_bump peek` + `splice`), which would
# add the SNI and non-TLS-in-tunnel checks Pipelock performs, and that was
# built and measured before being rejected. Three findings, in order of
# severity (docs/engines.md):
#
#   1. Squid aborts the process — `FATAL: assertion failed:
#      client_side.cc:2714: "port->secure.signingCa.cert.get()"` — the
#      first time a peeked connection has to be terminated without a
#      signing CA configured. Any client can trigger that, and it takes the
#      whole proxy down with it.
#   2. Supplying that CA means a private key in the image, which
#      docs/architecture.md rules out as a non-goal.
#   3. With `ssl-bump` on the port, Squid answers *every* CONNECT with
#      `200 Connection established` before evaluating http_access, and
#      denies afterwards by aborting the tunnel (`TCP_DENIED_ABORTED/200`
#      in its own log). Policy still holds, but the client is told the
#      tunnel succeeded, which breaks this repository's contract that a
#      denial is visible to the caller.
#
# So Squid enforces at the same layer as Smokescreen: the CONNECT target,
# not the tunnel's contents.
http_port 3128

visible_hostname internet-proxy-locally
httpd_suppress_version_string on
# Do not forward the client's address upstream; the sandbox's internal
# address is not the destination's business. `via` is left at its default:
# RFC 9110 requires a proxy to announce itself, and turning it off makes
# Squid log a WARNING on every start for a purely cosmetic header.
forwarded_for delete

# ---------------------------------------------------------------------------
# No caching, no disk state
# ---------------------------------------------------------------------------
# A filtering proxy has no business retaining response bodies, and a cache
# hit is a response nobody re-authorized.
cache deny all
cache_store_log none
pid_filename none
logfile_rotate 0

access_log stdio:/dev/stdout squid
cache_log stdio:/dev/stderr

# Pin the error pages to one directory instead of negotiating a language
# per request. Without this Squid answers every `deny_info` below with
# "Internal Error: Missing Template", because automatic localization only
# consults the templates compiled into the binary and the custom pages in
# images/squid/errors are not among them.
error_directory /usr/share/squid/errors/en

# ---------------------------------------------------------------------------
# Request sanity
# ---------------------------------------------------------------------------
# Reject requests whose Host header disagrees with the request target, so a
# client cannot get a connection authorized for one host and addressed to
# another.
host_verify_strict on
# Never expand a bare label through a search domain: `internal` must not
# become `internal.corp.example`.
dns_defnames off

# ---------------------------------------------------------------------------
# Deny floors (evaluated before any allow)
# ---------------------------------------------------------------------------

acl CONNECT method CONNECT
acl TLS_ports port 443

# A destination written as a bare address rather than a name.
#
# This exists because of how Squid resolves `dstdomain`: "a reverse lookup
# is tried if an IP based URL is used and no match is found". So a bare-IP
# CONNECT that matches nothing in the allowlist gets a second chance — the
# PTR record for that address is looked up and matched against the
# allowlist instead. PTR records belong to whoever holds the address block,
# and Squid does not forward-confirm the answer, so anyone who controls a
# destination host can point its PTR at `pypi.org` and reach it through a
# hostname allowlist that has never heard of them. Measured: with a
# resolver claiming PTR(1.1.1.1)=pypi.org, `CONNECT 1.1.1.1:443` was
# allowed under the real policy while `CONNECT 9.9.9.9:443` was refused —
# the PTR record was the only difference (docs/engines.md).
#
# Squid has no switch to disable that fallback, so the fix is to refuse
# address-form destinations before any `dstdomain` rule is reached. Nothing
# is lost: docs/policy.md allowlists by hostname and never by address, so a
# bare address could only ever have been denied.
#
# Matching the literal form is what keeps this safe from the same trap: the
# reverse lookup happens only when *no* match is found, and these patterns
# match, so evaluation stops here and no PTR query is made. The IPv6
# pattern requires a colon so that a single-label hostname made of hex
# characters is not caught by it.
acl ip_literal dstdom_regex -i ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$
acl ip_literal dstdom_regex -i ^\[?[0-9a-f]*:[0-9a-f:.]*\]?$

# `dst` matches the *resolved* destination address. For a hostname Squid
# resolves it first and the ACL matches if ANY returned address is in
# range, so both "public name -> private A record" and a mixed public
# +private answer set are caught. Squid then connects using that same
# cached answer, so the address it validated is the address it connects to.
acl metadata_ip dst 169.254.169.254/32
acl metadata_ip dst fd00:ec2::254/128
acl metadata_ip dst 100.100.100.200/32

acl private_ip dst 0.0.0.0/8
acl private_ip dst 10.0.0.0/8
acl private_ip dst 100.64.0.0/10
acl private_ip dst 127.0.0.0/8
acl private_ip dst 169.254.0.0/16
acl private_ip dst 172.16.0.0/12
acl private_ip dst 192.0.0.0/24
acl private_ip dst 192.0.2.0/24
acl private_ip dst 192.88.99.0/24
acl private_ip dst 192.168.0.0/16
acl private_ip dst 198.18.0.0/15
acl private_ip dst 198.51.100.0/24
acl private_ip dst 203.0.113.0/24
acl private_ip dst 224.0.0.0/4
acl private_ip dst 240.0.0.0/4
acl private_ip dst ::/128
acl private_ip dst ::1/128
acl private_ip dst 64:ff9b::/96
acl private_ip dst 100::/64
acl private_ip dst 2001:db8::/32
acl private_ip dst fc00::/7
acl private_ip dst fe80::/10
acl private_ip dst ff00::/8

# Squid's cache manager is reachable as an ordinary request. It is not part
# of the contract in docs/architecture.md and is denied outright.
http_access deny manager

# The metadata rule must precede the private rule: 169.254.169.254 is also
# link-local, and the more specific cause is the useful one to report.
http_access deny metadata_ip
http_access deny private_ip

# CONNECT is for TLS; restricting it to 443 keeps the tunnel from becoming
# a general-purpose TCP relay to allowlisted hosts. Stated *after* the IP
# floors so a private destination is attributed to SSRF, not to its port.
http_access deny CONNECT !TLS_ports

# Must precede the allowlist: the point is to refuse address-form
# destinations *before* a `dstdomain` rule can fall back to a PTR lookup.
# Placed after the SSRF floors so a private address still reports the more
# specific cause.
http_access deny ip_literal

# ---------------------------------------------------------------------------
# Allowlist
# ---------------------------------------------------------------------------

acl allowlist_exact dstdomain github.com
acl allowlist_exact dstdomain pypi.org
acl allowlist_exact dstdomain files.pythonhosted.org
acl allowlist_exact dstdomain registry.npmjs.org

acl allowlist_wild dstdom_regex -i \.github\.com$
acl allowlist_wild dstdom_regex -i \.githubusercontent\.com$

http_access allow allowlist_exact
http_access allow allowlist_wild

# ---------------------------------------------------------------------------
# Default deny
# ---------------------------------------------------------------------------
http_access deny all

# Each denial gets a one-line page naming its cause, so a client — and
# checks/egress.py's classifier — can tell an allowlist refusal from an
# SSRF refusal without reading the engine's logs.
deny_info ERR_IPL_METADATA metadata_ip
deny_info ERR_IPL_PRIVATE_IP private_ip
deny_info ERR_IPL_PORT_NOT_ALLOWED TLS_ports
deny_info ERR_IPL_IP_LITERAL ip_literal
deny_info ERR_IPL_NOT_ALLOWLISTED all

