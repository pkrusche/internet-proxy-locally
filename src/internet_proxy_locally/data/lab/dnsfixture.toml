# DNS fixture service — NOT a proxy engine, and never part of an
# operational run.
#
# Loaded by ./lab.py alone. It serves the two fixtures that public DNS
# cannot (see lab/dnsfixture/Dockerfile): the mixed public+private answer
# set in lab/config/dns-fixture.hosts, and the `rebind.fixture.test` zone
# whose answers change between the first lookup and the next.
#
# It has to be a resolver rather than a bind-mounted /etc/hosts: duplicate
# names in a hosts file collapse to one address (musl keeps the first,
# Squid's parser the last), so the engine would never see a multi-address
# answer. dnsmasq's --addn-hosts aggregates them.
#
# `./lab.py up` starts this container, reads its address, and points the
# engine's resolver at it with `--dns`. `./lab.py down` removes it, and so
# does any `./run.py up`. It publishes no host port — only the engine can
# reach it.
#
# Pinned by apk version, like Squid:  ./lab.py pin

[image]
repository = "internet-proxy-locally/dnsfixture"

[source.packages]
dnsmasq = "2.91-r1"
python3 = "3.12.14-r0"

[build]
base_image = "alpine:3.22.1"

[container]
name = "internet-proxy-dnsfixture"
internal_port = 53
config_file = "lab/config/dns-fixture.hosts"
config_mount = "/fixture/hosts"
args = []
