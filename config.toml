# Global configuration. See docs/policy.md and docs/lab.md.

[policy]
allow = [
    "api.anthropic.com",
    "claude.ai",
    "code.claude.com",
    "platform.claude.com",
    "api.openai.com",
    "auth.openai.com",
    "chatgpt.com",
    "github.com",
    "*.github.com",
    "*.githubusercontent.com",
    "pypi.org",
    "files.pythonhosted.org",
    "registry.npmjs.org",
]

# Lab-only additions; operational startup uses [policy] above.
[policy.test]
allow = [
    "*.nip.io",
    "*.sslip.io",
    "public-only.fixture.test",
    "mixed-public-first.fixture.test",
    "mixed-private-first.fixture.test",
    "*.rebind.fixture.test",
]

[fixture]
control = "public-only.fixture.test"
rebind_zone = "rebind.fixture.test"
ptr_address = "1.0.0.1"
ptr_claims = "pypi.org"

# Address values define public/private roles. At startup, the fixture replaces
# the public value with its local HTTPS interface and private values with its trap.
# No connection is made to these nominal addresses.
[fixture.records]
"public-only.fixture.test" = ["11.203.0.2"]
"mixed-public-first.fixture.test" = ["11.203.0.2", "10.0.0.1"]
"mixed-private-first.fixture.test" = ["10.0.0.1", "11.203.0.2"]
