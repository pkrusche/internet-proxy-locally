# Global configuration. See docs/policy.md and docs/lab.md.

[policy]
allow = [
    "api.anthropic.com",
    "claude.ai",
    "code.claude.com",
    "platform.claude.com",
    "api.openai.com",
    "auth.openai.com",
    "chatgpt.com",
    "github.com",
    "*.github.com",
    "*.githubusercontent.com",
    "pypi.org",
    "files.pythonhosted.org",
    "registry.npmjs.org",
]

tls_interception = false

# Lab-only additions; operational startup uses [policy] above.
[policy.test]
allow = [
    "*.nip.io",
    "*.sslip.io",
    "public-only.fixture.test",
    "mixed-public-first.fixture.test",
    "mixed-private-first.fixture.test",
    "*.rebind.fixture.test",
]

[fixture]
control = "public-only.fixture.test"
rebind_zone = "rebind.fixture.test"
ptr_address = "1.0.0.1"
ptr_claims = "pypi.org"

[fixture.records]
"public-only.fixture.test" = ["9.9.9.9"]
"mixed-public-first.fixture.test" = ["9.9.9.9", "10.0.0.1"]
"mixed-private-first.fixture.test" = ["10.0.0.1", "9.9.9.9"]
