# Squid service definition.
#
# Upstream Squid publishes no official OCI image and no source-build recipe
# small enough to be worth carrying here, so this builds a minimal image
# around the Alpine package at a pinned apk version. `package_version` is
# that pin; it starts empty in a fresh checkout. Record it once, on a
# networked machine, with:
#
#     ./run.py pin squid
#
# and commit the result. `./run.py setup` builds the image and tags it with
# the pinned version; `./run.py up` refuses to start if the pinned image is
# not present (fail closed).
#
# Alpine keeps one squid version per release branch, so a pin is stable
# until the base image moves. If a bump ever removes the pinned version
# from the repository, `setup` fails at `apk add` rather than silently
# installing something else.

[image]
repository = "internet-proxy-locally/squid"

[source]
package = "squid"
package_version = "6.12-r0"

[build]
# Base image pin for images/squid/Dockerfile. Update deliberately; keep in
# sync with the ARG default in the Dockerfile. Alpine's squid is built
# `--with-openssl`, which the Dockerfile verifies at build time.
base_image = "alpine:3.22.1"

[container]
name = "internet-proxy-squid"
internal_port = 3128
config_file = "config/squid.conf"
test_config_file = "config/squid.test.conf"
config_mount = "/etc/squid/squid.conf"
# The entrypoint already carries `-N -f /etc/squid/squid.conf`; the policy
# arrives entirely through the read-only bind mount above.
args = []
