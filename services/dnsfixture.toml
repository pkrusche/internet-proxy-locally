# DNS fixture service — NOT a proxy engine.
#
# Serves the two fixtures that public DNS cannot (see
# images/dnsfixture/Dockerfile): the mixed public+private answer set in
# config/dns-fixture.hosts, and the `rebind.fixture.test` zone whose
# answers change between the first lookup and the next.
#
# `./run.py up --test-policy` starts this container, reads its address,
# and points the engine's resolver at it with `--dns`. A normal
# `./run.py up` removes it. It is never running during normal operation,
# and it publishes no host port — only the engine can reach it.
#
# Pinned by apk version, like Squid:  ./run.py pin dnsfixture

[image]
repository = "internet-proxy-locally/dnsfixture"

[source.packages]
dnsmasq = "2.91-r1"
python3 = "3.12.14-r0"

[build]
base_image = "alpine:3.22.1"

[container]
name = "internet-proxy-dnsfixture"
internal_port = 53
config_file = "config/dns-fixture.hosts"
test_config_file = "config/dns-fixture.hosts"
config_mount = "/fixture/hosts"
args = []
