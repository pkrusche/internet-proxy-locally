[project]
name = "internet-proxy-locally"
version = "0.1.0"
description = "Local containerized Internet filtering proxy for coding-agent sandboxes"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "cryptography>=42",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
Documentation = "https://github.com/internet-proxy-locally/internet-proxy-locally#readme"
Source = "https://github.com/internet-proxy-locally/internet-proxy-locally"
Issues = "https://github.com/internet-proxy-locally/internet-proxy-locally/issues"

[project.scripts]
ipl = "internet_proxy_locally.cli.run:main"
ipl-lab = "internet_proxy_locally.cli.lab:main"
ipl-check = "internet_proxy_locally.checks.egress:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/internet_proxy_locally"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/internet_proxy_locally/**",
    "/tests/**",
    "/scripts/**",
    "/docs/**",
    "/lab/**",
    "/config/**",
    "/config.toml",
    "/README.md",
    "/SECURITY.md",
    "/CONTRIBUTING.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
    "/uv.lock",
]
exclude = ["**/__pycache__/**", "**/*.pyc", "/state/**", "/results/**"]

[dependency-groups]
dev = [
    "ruff>=0.16.5",
    "ty>=0.0.77",
]
