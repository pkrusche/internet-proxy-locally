[project]
name = "internet-proxy-locally"
version = "0.1.0"
description = "Local containerized Internet filtering proxy for coding-agent sandboxes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Peter Krusche" }]
keywords = [
    "proxy",
    "allowlist",
    "egress",
    "sandbox",
    "ssrf",
    "coding-agent",
]
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "cryptography>=42",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Security",
]

[project.urls]
Documentation = "https://github.com/pkrusche/internet-proxy-locally#readme"
Source = "https://github.com/pkrusche/internet-proxy-locally"
Issues = "https://github.com/pkrusche/internet-proxy-locally/issues"

[project.scripts]
ipl = "internet_proxy_locally.cli.run:main"
ipl-lab = "internet_proxy_locally.cli.lab:main"
ipl-check = "internet_proxy_locally.checks.egress:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/internet_proxy_locally"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/internet_proxy_locally/**",
    "/tests/**",
    "/scripts/**",
    "/docs/**",
    "/lab/**",
    "/config/**",
    "/config.toml",
    "/README.md",
    "/SECURITY.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
    "/uv.lock",
]
exclude = ["**/__pycache__/**", "**/*.pyc", "/state/**", "/results/**"]

[dependency-groups]
dev = [
    "ruff>=0.16.5",
    "ty>=0.0.77",
]
