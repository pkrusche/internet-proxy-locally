version: 1
mode: strict
enforce: true

api_allowlist:
  - github.com
  - "*.github.com"
  - "*.githubusercontent.com"
  - pypi.org
  - files.pythonhosted.org
  - registry.npmjs.org
  # --- [policy.test] in lab/fixtures.toml: adversarial fixtures only ---
  - "*.nip.io"
  - "*.sslip.io"
  - public-only.fixture.test
  - mixed-public-first.fixture.test
  - mixed-private-first.fixture.test
  - "*.rebind.fixture.test"

forward_proxy:
  enabled: true
  # CONNECT target must match the TLS ClientHello SNI (blocks domain fronting).
  sni_verification: true
  # Bytes inside a CONNECT tunnel must be TLS (blocks raw protocol smuggling).
  sni_require_tls: true

tls_interception:
  enabled: false
