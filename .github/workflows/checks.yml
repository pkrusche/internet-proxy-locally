# Static checks: ruff for lint and formatting, ty for types. All three are
# one-liners locally too —
#
#     uv run ruff check .           uv run ruff check --fix .   to fix
#     uv run ruff format --check .  uv run ruff format .        to fix
#     uv run ty check
name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: ruff check
        run: uv run --frozen --only-group dev ruff check .

      - name: ruff format
        if: '!cancelled()'
        run: uv run --frozen --only-group dev ruff format --check .

  ty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: ty check
        run: uv run --frozen ty check

  tests:
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: run tests
        run: uv run --frozen python -m unittest discover -s tests -t .

      - name: report drift
        run: |
          uv run --frozen ipl-lab report --check

  artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: build and inspect fresh artifacts
        run: |
          touch UNTRACKED-RELEASE-SENTINEL
          uv build --out-dir dist
          scripts/check-artifacts.py dist/*.whl dist/*.tar.gz
          ! unzip -l dist/*.whl | grep UNTRACKED-RELEASE-SENTINEL
          ! tar -tzf dist/*.tar.gz | grep UNTRACKED-RELEASE-SENTINEL
