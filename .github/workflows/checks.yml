# Static checks: ruff for lint and formatting, ty for types. All three are
# one-liners locally too —
#
#     uv run ruff check .           uv run ruff check --fix .   to fix
#     uv run ruff format --check .  uv run ruff format .        to fix
#     uv run ty check
#
# Nothing here starts a container or touches the network, so it is the fast
# gate; the container-backed lab suite is not run
# from CI because they need a real container runtime.
#
# The `tests` job runs the unittest suite (`tests/`), which per CLAUDE.md
# also needs no network or container runtime, so it belongs in this same
# fast gate.
name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Two jobs rather than two steps: they are independent, so a type error and
  # a formatting slip are reported in the same run instead of the first one
  # hiding the second.
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # --frozen resolves nothing: the ruff version is the one in uv.lock, so
      # this job and a developer's `uv run ruff` are the same binary. Without
      # it a newer ruff could fail a build that nothing in the repo changed.
      # --only-group dev skips installing the project and its runtime
      # dependencies, which linting does not need.
      - name: ruff check
        run: uv run --frozen --only-group dev ruff check .

      # Runs even when the lint step failed, so one push reports both.
      - name: ruff format
        if: '!cancelled()'
        run: uv run --frozen --only-group dev ruff format --check .

  ty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # No --only-group here, unlike ruff: ty resolves imports, so it needs
      # the runtime dependencies installed. Without them it reports
      # unresolved-import errors instead of checking anything.
      - name: ty check
        run: uv run --frozen ty check

  tests:
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      # No --only-group here either: the suite imports the package itself,
      # so it needs the runtime dependencies installed the same way `ty check` does.
      - name: run tests
        run: uv run --frozen python -m unittest discover -s tests -t .

      - name: policy and report drift
        run: |
          uv run --frozen ipl policy --check
          uv run --frozen ipl-lab policy --check
          uv run --frozen ipl-lab report --check

  artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: build and inspect fresh artifacts
        run: |
          touch UNTRACKED-RELEASE-SENTINEL
          uv build --out-dir dist
          scripts/check-artifacts.py dist/*.whl dist/*.tar.gz
          ! unzip -l dist/*.whl | grep UNTRACKED-RELEASE-SENTINEL
          ! tar -tzf dist/*.tar.gz | grep UNTRACKED-RELEASE-SENTINEL
